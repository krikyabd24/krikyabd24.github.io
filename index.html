<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krikya Official 2026</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d2119;
            color: white;
            padding-bottom: 70px; /* Space for bottom bar */
        }

        /* Header */
        .header {
            background-color: #111;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo img { height: 28px; }
        .chat-icon { width: 30px; height: 30px; background: #007bff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }

        /* Banner */
        .banner img {
            width: 100%;
            display: block;
            border-bottom: 4px solid #ff8c00;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background-color: #fff;
            overflow-x: auto;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
        .nav-item {
            flex: 0 0 auto;
            width: 85px;
            text-align: center;
            color: #333;
            font-size: 11px;
            font-weight: bold;
        }
        .nav-item img { width: 32px; display: block; margin: 0 auto 4px; }

        /* Section Title */
        .section-title {
            padding: 12px 15px;
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        /* Games Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }
        .game-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #222;
        }
        .game-card img { width: 100%; display: block; }
        .game-name { font-size: 12px; padding: 6px 0; color: #ff8c00; font-weight: bold; }

        /* Footer Info */
        .footer-info {
            padding: 25px 15px;
            text-align: center;
            font-size: 12px;
            color: #888;
            background-color: #081611;
            line-height: 1.6;
        }

        /* Bottom Bar */
        .footer-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            height: 65px;
            z-index: 1000;
        }
        .lang-sec {
            width: 85px;
            background-color: #ddd;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
        }
        .btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-login { background-color: #ff8c00; color: #000; }
        .btn-register { background-color: #2d8a63; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size:24px;">☰</div>
        <div class="logo"><img src="https://i.ibb.co/Vp8pXQv/krikya-logo.png" alt="Logo"></div>
        <div class="chat-icon">💬</div>
    </div>

    <div class="banner">
        <img src="1771434595606.jpg" alt="Weekend Bonus">
    </div>

    <div class="nav-tabs">
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/1055/1055823.png">SLOTS</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/5351/5351486.png">CRICKET</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/2360/2360814.png">CASINO</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/3556/3556942.png">CRASH</div>
    </div>

    <div class="section-title">HOT GAMES ⌵</div>

    <div class="game-grid">
        <div class="game-card">
            <img src="IMG_20260218_230136.jpg" alt="Aviator">
            <div class="game-name">Aviator</div>
        </div>
        <div class="game-card">
            <img src="IMG_20260218_230204.jpg" alt="Exchange">
            <div class="game-name">Exchange</div>
        </div>
        <div class="game-card">
            <img src="IMG_20260218_232103.jpg" alt="Crazy Time">
            <div class="game-name">Crazy Time</div>
        </div>
        <div class="game-card">
            <img src="IMG_20260218_232136.jpg" alt="Money Coming">
            <div class="game-name">Money Coming</div>
        </div>
    </div>

    <div class="footer-info">
        <p><strong>KRIKYA OFFICIAL</strong> - Licensed Gaming in Bangladesh.</p>
        <p>Fast Deposits | 24/7 Support | Secure Withdrawals</p>
        <div style="margin-top: 10px;">
            <span style="border: 1px solid #444; padding: 3px 8px; border-radius: 4px;">18+ Play Responsibly</span>
        </div>
    </div>

    <div class="footer-bar">
        <div class="lang-sec">
            <span>🇧🇩 ৳ BDT</span>
            <span>English</span>
        </div>
        <a href="https://www.krikya11.club/?af=AG002491" class="btn btn-login">LOGIN</a>
        <a href="https://www.krikya11.club/?af=AG002491" class="btn btn-register">JOIN NOW</a>
    </div>

</body>
</html>
