<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krikya Official 2026</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d2119;
            color: white;
            padding-bottom: 70px;
        }

        /* Header */
        .header {
            background-color: #111;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo img { height: 28px; }
        .chat-icon { width: 28px; }

        /* Main Banner */
        .banner-container img {
            width: 100%;
            display: block;
            border-bottom: 4px solid #ff8c00;
        }

        /* Category Nav (Scrollable) */
        .nav-tabs {
            display: flex;
            background-color: #fff;
            overflow-x: auto;
            padding: 5px 0;
            border-bottom: 2px solid #ff8c00;
            white-space: nowrap;
        }
        .nav-item {
            flex: 0 0 auto;
            min-width: 80px;
            padding: 8px 5px;
            text-align: center;
            color: #333;
            font-size: 11px;
            font-weight: bold;
        }
        .nav-item img {
            width: 32px;
            height: 32px;
            display: block;
            margin: 0 auto 5px;
        }

        /* Games Grid */
        .section-title {
            padding: 12px 15px;
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }
        .game-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
        }
        .game-card img { width: 100%; display: block; }
        .game-name { font-size: 12px; padding: 5px 0; color: #ff8c00; }

        /* Bottom Bar */
        .footer-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            height: 60px;
            z-index: 1000;
        }
        .lang-sec {
            width: 80px;
            background-color: #ddd;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
        }
        .btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        
        /* Login Button Orange */
        .btn-login { 
            background-color: #ff8c00; 
            color: black; 
        }
        
        /* Register Button Green */
        .btn-register { 
            background-color: #2d8a63; 
            color: white; 
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size:24px;">☰</div>
        <div class="logo"><img src="https://i.ibb.co/Vp8pXQv/krikya-logo.png" alt="Logo"></div>
        <img src="https://cdn-icons-png.flaticon.com/512/134/134914.png" class="chat-icon">
    </div>

    <div class="banner-container">
        <img src="1771434595606.jpg" alt="Weekend Bonus">
    </div>

    <div class="nav-tabs">
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/1055/1055823.png"> SLOTS</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/5351/5351486.png"> CRICKET</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/2360/2360814.png"> CASINO</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/3556/3556942.png"> CRASH</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/1055/1055848.png"> TABLE</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/2906/2906951.png"> SPORTS</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/2165/2165181.png"> FISHING</div>
    </div>

    <div class="section-title">HOT GAMES ⌵</div>

    <div class="game-grid">
        <div class="game-card">
            <img src="IMG_20260218_230136.jpg" alt="Aviator">
            <div class="game-name">Aviator</div>
        </div>
        <div class="game-card">
            <img src="IMG_20260218_230204.jpg" alt="Exchange">
            <div class="game-name">Exchange</div>
        </div>
        <div class="game-card">
            <img src="IMG_20260218_232103.jpg" alt="Crazy Time">
            <div class="game-name">Crazy Time</div>
        </div>
        <div class="game-card">
            <img src="IMG_20260218_232136.jpg" alt="Money Coming">
            <div class="game-name">Money Coming</div>
        </div>
    </div>

    <div class="footer-bar">
        <div class="lang-sec">
            <span>🇧🇩 ৳ BDT</span>
            <span>English</span>
        </div>
        <a href="https://www.krikya11.club/?af=AG002491" class="btn btn-login">LOGIN</a>
        <a href="https://www.krikya11.club/?af=AG002491" class="btn btn-register">JOIN NOW</a>
    </div>

</body>
</html>
