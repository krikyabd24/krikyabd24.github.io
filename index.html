<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krikya Style Layout</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f2f2;
}

/* TOP BAR */
.topbar{
  background:#1f7a59;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

/* BANNER */
.banner{
  background:linear-gradient(90deg,#0f5132,#198754);
  color:white;
  padding:25px;
  border-radius:12px;
  margin:15px;
  text-align:center;
}

.banner h2{
  margin:0;
  font-size:22px;
}

.banner p{
  font-size:14px;
  margin-top:8px;
}

/* CATEGORY MENU */
.menu{
  display:flex;
  justify-content:space-around;
  background:white;
  padding:15px 0;
  border-top:3px solid #198754;
}

.menu div{
  text-align:center;
  font-size:14px;
  color:#ff6600;
  font-weight:bold;
}

/* GAME GRID */
.games{
  display:flex;
  justify-content:space-around;
  padding:20px;
}

.game{
  width:80px;
  height:80px;
  background:white;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  text-align:center;
}

/* BOTTOM SECTION */
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
}

.login{
  width:50%;
  background:#198754;
  color:white;
  text-align:center;
  padding:15px;
  font-weight:bold;
}

.register{
  width:50%;
  background:#ff6600;
  color:white;
  text-align:center;
  padding:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="topbar">
KRIKYA
</div>

<div class="banner">
  <h2>আমন্ত্রণ ও স্পিন উৎসব</h2>
  <p>সপ্তাহে পান সর্বোচ্চ ৩০০টি ফ্রি স্পিন</p>
</div>

<div class="menu">
  <div>হট গেমস</div>
  <div>স্লট</div>
  <div>ক্রিকেট</div>
  <div>ক্যাসিনো</div>
</div>

<div class="games">
  <div class="game">Aviator</div>
  <div class="game">Exchange</div>
  <div class="game">Crazy Time</div>
  <div class="game">Money</div>
</div>

<div class="bottom">
  <div class="login">প্রবেশ করুন</div>
  https://www.krikya11.club/?af=AG002491
  <div class="register">নিবন্ধন</div>https://www.krikya11.club/?af=AG002491
</div>

</body>
</html>
